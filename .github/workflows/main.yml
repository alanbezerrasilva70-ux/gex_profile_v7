name: GEX Cloud Bot

on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          sudo apt-get install -y xvfb
          pip install pandas selenium undetected-chromedriver google-api-python-client google-auth-httplib2 google-auth
          mkdir -p ./GEX_Data

      - name: Executar o Motor Black-Scholes
        run: xvfb-run python gex_profile_v7_cloud.py

      - name: Criar Arquivo de Credenciais
        run: echo '${{ secrets.DRIVE_CREDENTIALS }}' > credentials.json

      - name: Upload Direto via Google API
        env:
          FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: |
          python -c "
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          path = './GEX_Data'
          files = os.listdir(path)
          print(f'📄 Arquivos gerados no servidor: {files}')

          if files:
              SCOPES = ['https://www.googleapis.com/auth/drive']
              creds = service_account.Credentials.from_service_account_file('credentials.json', scopes=SCOPES)
              service = build('drive', 'v3', credentials=creds)
              folder_id = os.environ.get('FOLDER_ID')

              for f in files:
                  filepath = os.path.join(path, f)
                  if os.path.isfile(filepath):
                      query = f\"name='{f}' and '{folder_id}' in parents and trashed=false\"
                      results = service.files().list(q=query, spaces='drive', fields='files(id, name)').execute()
                      items = results.get('files', [])

                      media = MediaFileUpload(filepath, resumable=True)
                      if items:
                          file_id = items[0]['id']
                          service.files().update(fileId=file_id, media_body=media).execute()
                          print(f'🔄 Atualizado no Drive: {f}')
                      else:
                          file_metadata = {'name': f, 'parents': [folder_id]}
                          service.files().create(body=file_metadata, media_body=media, fields='id').execute()
                          print(f'✅ Criado no Drive: {f}')
          else:
              print('⚠️ Alerta: A pasta GEX_Data está vazia.')
          "
