name: GEX Cloud Bot

on:
  schedule:
    # Roda a cada 30 minutos de segunda a sexta (horário UTC, ajuste conforme necessário)
    - cron: '*/30 13-21 * * 1-5'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install pandas selenium pydrive2
          mkdir -p ./GEX_Data

      - name: Executar o Motor Black-Scholes
        run: python gex_profile_v7.py

      - name: Upload para o Google Drive
        uses: adityak74/google-drive-upload-action@main
        with:
          credentials: ${{ secrets.DRIVE_CREDENTIALS }}
          filename: "./GEX_Data/"
          folderId: ${{ secrets.DRIVE_FOLDER_ID }}
          overwrite: "true"
