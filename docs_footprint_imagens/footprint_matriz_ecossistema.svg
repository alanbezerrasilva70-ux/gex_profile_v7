    <text x="490" y="418" fill="#6ee7b7" font-weight="700">• Non-Overlapping Side Bubble Lane</text>
    <text x="502" y="436" fill="#cbd5e1">Bubbles sit cleanly beside cluster bricks</text>
    <text x="490" y="466" fill="#6ee7b7" font-weight="700">• Topbar Quick Popup &amp; Presets</text>
    <text x="502" y="484" fill="#cbd5e1">1-click ES (1t) vs NQ (4t) presets</text>
  </g>
  <rect x="490" y="530" width="380" height="168" rx="6" fill="#06140f" stroke="#10b981"/>
  <text x="506" y="556" fill="#34d399" font-size="12" font-weight="700">Confluence Highlighting:</text>
  <text x="506" y="580" fill="#cbd5e1" font-size="10.5">• Stacked Imb + TPO VAH/VAL Breakout</text>
  <text x="506" y="602" fill="#cbd5e1" font-size="10.5">• Wick Abs inside Call/Put Wall = A+</text>
  <text x="506" y="624" fill="#cbd5e1" font-size="10.5">• Naked Bar VPOC (auto ends on touch)</text>
  <text x="506" y="646" fill="#cbd5e1" font-size="10.5">• Persistence across F5 &amp; NT8 reopen</text>
  <text x="506" y="668" fill="#cbd5e1" font-size="10.5">• Zero external Hardware ID polling</text>

