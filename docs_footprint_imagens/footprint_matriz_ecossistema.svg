    </linearGradient>
  </defs>
  <rect width="1360" height="760" fill="url(#bgMat)"/>

  <text x="36" y="42" fill="#f8fafc" font-size="22" font-weight="700">VeltrixQuant Footprint Pro (#17) — Decision Matrix (Keep · Upgrade · Omit)</text>
