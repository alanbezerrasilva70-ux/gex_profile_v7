<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 760" width="1360" height="760" font-family="'Segoe UI', 'Consolas', sans-serif">
  <defs>
    <linearGradient id="bgMat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
