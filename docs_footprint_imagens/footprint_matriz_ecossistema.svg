    <text x="64" y="196" fill="#cbd5e1">BidAsk, Vol, Delta, SplitDeltaImb, Trades</text>
    <text x="52" y="226" fill="#7dd3fc" font-weight="700">• Cluster Style &amp; Gradients</text>
    <text x="64" y="244" fill="#cbd5e1">Brick, Histogram, Split, Ladder, Saturation</text>
    <text x="52" y="274" fill="#7dd3fc" font-weight="700">• Filters &amp; Orderflow Classification</text>
    <text x="64" y="292" fill="#cbd5e1">Ticks/level, Trade min/max, Spread Split</text>
    <text x="52" y="322" fill="#7dd3fc" font-weight="700">• Imbalance &amp; Stacked S/R Zones</text>
    <text x="64" y="340" fill="#cbd5e1">Diag/Horiz Imb %, Consecutive S/R Zones</text>
    <text x="52" y="370" fill="#7dd3fc" font-weight="700">• Bar Volume Profile &amp; Unfinished</text>
    <text x="64" y="388" fill="#cbd5e1">Primary/Other VPOCs, Bar VA 68%, 0-side</text>
    <text x="52" y="418" fill="#7dd3fc" font-weight="700">• Bar Statistic &amp; Statistic Grid</text>
    <text x="64" y="436" fill="#cbd5e1">Vol, Delta, %, Min/Max, COT H/L, Ratio, Vol/s</text>
    <text x="52" y="466" fill="#7dd3fc" font-weight="700">• Predicted Values &amp; Quick Levels</text>
    <text x="64" y="484" fill="#cbd5e1">Predicted vol + mouse-drag local S/R</text>
  </g>
  <rect x="52" y="530" width="382" height="168" rx="6" fill="#09101d" stroke="#1e293b"/>
  <text x="68" y="556" fill="#38bdf8" font-size="12" font-weight="700">Calculation Modes Covered:</text>
  <text x="68" y="580" fill="#cbd5e1" font-size="10.5">1. Bid / Ask Real-Time Classification</text>
  <text x="68" y="602" fill="#cbd5e1" font-size="10.5">2. UpDownTick (Quote Gap Fallback)</text>
  <text x="68" y="624" fill="#cbd5e1" font-size="10.5">3. Hybrid (Bid/Ask + TickRule Split)</text>
  <text x="68" y="646" fill="#cbd5e1" font-size="10.5">4. Real-Time Tape Recon (&lt;10ms merges)</text>
  <text x="68" y="668" fill="#cbd5e1" font-size="10.5">5. Bar Impulse &amp; Exhaustion Scanners</text>

