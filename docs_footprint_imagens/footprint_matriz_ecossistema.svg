    <text x="490" y="226" fill="#6ee7b7" font-weight="700">• Direct2D Viewport Batching (60+ FPS)</text>
    <text x="502" y="244" fill="#cbd5e1">Zero GDI+ locks, zero frame allocations</text>
    <text x="490" y="274" fill="#6ee7b7" font-weight="700">• Dynamic Zoom LOD Aggregation</text>
    <text x="502" y="292" fill="#cbd5e1">Auto-merges NQ ticks when zooming out</text>
    <text x="490" y="322" fill="#6ee7b7" font-weight="700">• True L2-Verified Absorption Engine</text>
