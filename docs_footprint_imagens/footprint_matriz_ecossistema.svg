    <text x="939" y="196" fill="#cbd5e1">Covered by PerfilTpoVolumePro (#16)</text>
    <text x="927" y="226" fill="#fde047" font-weight="700">✕ Standalone Cumulative Delta Line</text>
    <text x="939" y="244" fill="#cbd5e1">Dedicated in DeltaCumulativePro (#9)</text>
    <text x="927" y="274" fill="#fde047" font-weight="700">✕ Raw DOM Spoofing / Depth Heat</text>
    <text x="939" y="292" fill="#cbd5e1">Built for 60 FPS in HeatmapLiquidez (#15)</text>
    <text x="927" y="322" fill="#fde047" font-weight="700">✕ Full Iceberg Reload Tracking</text>
    <text x="939" y="340" fill="#cbd5e1">Dedicated in FluentliWatchdog (#10)</text>
    <text x="927" y="370" fill="#fde047" font-weight="700">✕ Tape Speed / Burst Flash Box</text>
    <text x="939" y="388" fill="#cbd5e1">0ms live in Market Pulse (#13)</text>
    <text x="927" y="418" fill="#fde047" font-weight="700">✕ 30 Individual .wav Alert Slots</text>
    <text x="939" y="436" fill="#cbd5e1">Replaced by 4 focused high-signal alerts</text>
    <text x="927" y="466" fill="#fde047" font-weight="700">✕ Crypto Divider &amp; Licensing Bloat</text>
    <text x="939" y="484" fill="#cbd5e1">Clean native CME Futures focus</text>
  </g>
  <rect x="930" y="530" width="374" height="168" rx="6" fill="#140c10" stroke="#f59e0b"/>
  <text x="946" y="556" fill="#fbbf24" font-size="12.5" font-weight="700">Result of Modular Pruning:</text>
  <text x="946" y="582" fill="#cbd5e1" font-size="11.5">• 60% smaller property grid — fast setup</text>
  <text x="946" y="606" fill="#cbd5e1" font-size="11.5">• Zero duplicate OnMarketData handlers per bar</text>
  <text x="946" y="630" fill="#cbd5e1" font-size="11.5">• Zero overlapping VA rectangles competing</text>
  <text x="946" y="654" fill="#cbd5e1" font-size="11.5">• Footprint focuses 100% on inside-the-bar edge</text>
</svg>
